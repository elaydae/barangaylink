<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/images/barangaylink-favicon.png" />
    <title>Log In | BarangayLink</title>
    <meta name="description" content="Resident login for BarangayLink." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <header class="site-header auth-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="BarangayLink home page">
          <span class="brand-mark">BL</span>
          <span>BarangayLink</span>
        </a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <div class="auth-header-block">
          <p class="eyebrow">Welcome back</p>
          <h1 id="login-title">Log In</h1>
        </div>

        <form class="auth-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <div class="password-wrap">
              <input id="login-password" name="password" type="password" placeholder="Enter your password" required />
              <button type="button" class="toggle-password" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="inline-options">
            <label class="checkbox-inline">
              <input type="checkbox" name="remember" />
              <span>Remember Me</span>
            </label>
            <a href="index.html" class="text-link">Forgot Password</a>
          </div>

          <button type="submit" class="btn btn-primary block-btn">Log In</button>
        </form>

        <p class="auth-switch">
          Need an account?
          <a href="register.html">Create an Account</a>
        </p>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
