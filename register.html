<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | BarangayLink</title>
    <meta name="description" content="Register for BarangayLink." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <header class="site-header auth-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="BarangayLink home page">
          <span class="brand-mark">BL</span>
          <span>BarangayLink</span>
        </a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card wide-card" aria-labelledby="register-title">
        <div class="auth-header-block">
          <p class="eyebrow">Create an account</p>
          <h1 id="register-title">Register</h1>
        </div>

        <form class="auth-form" novalidate>
          <div class="form-grid two-columns">
            <div class="field">
              <label for="full-name">Full Name</label>
              <input id="full-name" name="fullName" type="text" placeholder="Juan Dela Cruz" required />
            </div>

            <div class="field">
              <label for="contact-number">Contact Number</label>
              <input id="contact-number" name="contactNumber" type="tel" placeholder="0917-123-4567" required />
            </div>

            <div class="field full-width">
              <label for="address">Address</label>
              <input id="address" name="address" type="text" placeholder="House No., Street, Brgy." required />
            </div>

            <div class="field">
              <label for="register-email">Email</label>
              <input id="register-email" name="email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="field">
              <label for="register-password">Password</label>
              <div class="password-wrap">
                <input id="register-password" name="password" type="password" placeholder="Create a password" required />
                <button type="button" class="toggle-password" aria-label="Show password">Show</button>
              </div>
            </div>

            <div class="field">
              <label for="confirm-password">Confirm Password</label>
              <div class="password-wrap">
                <input id="confirm-password" name="confirmPassword" type="password" placeholder="Re-enter password" required />
                <button type="button" class="toggle-password" aria-label="Show password">Show</button>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary block-btn">Create Account</button>
        </form>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
