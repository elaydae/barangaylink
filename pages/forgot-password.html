<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarangayLink | Forgot Password</title>

  <link rel="stylesheet" href="../css/style.css" />

  <style>
    .auth-page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      box-sizing: border-box;
      background: linear-gradient(180deg, #eef7f3, #f5f7f9);
    }

    .auth-card {
      width: min(100%, 560px);
      background: var(--card, #ffffff);
      border: 1px solid var(--border, #dfe7e5);
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      padding: 2.5rem;
      box-sizing: border-box;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #155e59;
      color: #ffffff;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .auth-brand h1 {
      margin: 0;
      color: #123f3b;
      font-size: 2rem;
      line-height: 1.1;
    }

    .auth-brand p {
      margin: 0.4rem 0 0;
      color: #61778a;
      font-size: 0.95rem;
    }

    .auth-content h2 {
      margin: 0 0 0.75rem;
      color: #123f3b;
      font-size: 2rem;
    }

    .auth-content .muted {
      margin: 0 0 1.75rem;
      color: #61778a;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    .field label {
      display: block;
      margin-bottom: 0.5rem;
      color: #123f3b;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.9rem 1rem;
      border: 1px solid #d8e2e0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #ffffff;
    }

    .field input:focus {
      border-color: #155e59;
      box-shadow: 0 0 0 3px rgba(21, 94, 89, 0.1);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 0.95rem 1.2rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #155e59;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #124e4a;
    }

    .auth-footer {
      margin: 1.5rem 0 0;
      color: #61778a;
      text-align: center;
    }

    .text-link {
      color: #155e59;
      font-weight: 700;
      text-decoration: none;
    }

    .text-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .auth-page {
        padding: 1rem;
      }

      .auth-card {
        padding: 1.5rem;
        border-radius: 18px;
      }

      .auth-brand h1 {
        font-size: 1.6rem;
      }

      .auth-content h2 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>
  <main class="auth-page">
    <section class="auth-card">

      <div class="auth-brand">
        <div class="brand-mark">BL</div>

        <div>
          <h1>BarangayLink</h1>
          <p>Barangay Information &amp; E-Services</p>
        </div>
      </div>

      <div class="auth-content">
        <h2>Forgot Password</h2>

        <p class="muted">
          Enter your registered email address and we'll help you reset your password.
        </p>

        <form id="forgot-password-form">

          <div class="field">
            <label for="forgot-email">Email Address</label>

            <input
              id="forgot-email"
              name="email"
              type="email"
              placeholder="Enter your email address"
              autocomplete="email"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary">
            Send Reset Link
          </button>

        </form>

        <p class="auth-footer">
          Remember your password?
          <a href="login.html" class="text-link">Back to Login</a>
        </p>
      </div>

    </section>
  </main>

  <script>
    document
      .getElementById("forgot-password-form")
      .addEventListener("submit", function (event) {

        event.preventDefault();

        const email = document
          .getElementById("forgot-email")
          .value
          .trim();

        if (!email) {
          alert("Please enter your email address.");
          return;
        }

        alert(
          "If an account exists with this email, a password reset link will be sent."
        );
      });
  </script>
</body>
</html>
